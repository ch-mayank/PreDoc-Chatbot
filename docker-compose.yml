services:
  app:
    image: predoc-app:beta
    ports:
      - "8010:8010"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
    secrets:
      - source: primary_api_key
        mode: 0444
      - source: nvidia_api_key
        mode: 0444
      - source: openrouter_key
        mode: 0444
      - source: admin_user
        mode: 0444
      - source: admin_pass
        mode: 0444
      - source: clinical_api_key
        mode: 0444
      - source: admin_api_key
        mode: 0444
    volumes:
      - /mnt/data/work/work-config/PreDoc-Chatbot/storage:/app/storage
      - /mnt/data/work/work-config/PreDoc-Chatbot/data:/app/data
      - /mnt/data/work/work-secrets:/mnt/data/work/work-secrets:ro

  tunnel:
    image: cloudflare/cloudflared:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
    command: tunnel --url http://app:8010

secrets:
  primary_api_key:
    external: true
  nvidia_api_key:
    external: true
  openrouter_key:
    external: true
  admin_user:
    external: true
  admin_pass:
    external: true
  clinical_api_key:
    external: true
  admin_api_key:
    external: true