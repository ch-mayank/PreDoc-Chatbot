# Machine-readable YAML schema for PreDoc Clinical Knowledge Base validation
schema_version: "2.2"
document_type: "clinical_knowledge_base"

metadata_schema:
  type: object
  required:
    - document_id
    - category
    - document_version
    - effective_date
    - reviewed_by
    - source
    - purpose
  properties:
    document_id:
      type: string
      pattern: "^KB-[A-Z]{3,4}-2026-V[0-9]+$"
    category:
      type: string
    document_version:
      type: string
      pattern: "^v[0-9]+\\.[0-9]+$"
    effective_date:
      type: string
      format: date
    reviewed_by:
      type: string
    source:
      type: string
    purpose:
      type: string

matrix_schema:
  type: array
  items:
    type: object
    required:
      - id
      - disease
      - icd10
      - priority_tier
      - demographics
      - primary_presentation
      - secondary_presentation
      - risk_factors
      - red_flags
      - probing_questions
      - differentials
    properties:
      id:
        type: string
        pattern: "^\\*\\*[A-Z]{3,4}-[0-9]{3}\\*\\*$"
        description: "Sequential bold alphanumeric identifier"
      disease:
        type: string
        minLength: 3
        description: "Official clinical condition name"
      icd10:
        type: string
        pattern: "^[A-Z][0-9]{2}(\\.[0-9A-Z]{1,4})?$"
        description: "Standard WHO / CMS ICD-10-CM diagnostic code"
      priority_tier:
        type: string
        enum:
          - "Level 1 (Red)"
          - "Level 2 (Yellow)"
          - "Level 3 (Green)"
      demographics:
        type: string
        description: "Age bracket; Biological Sex predilection"
      primary_presentation:
        type: string
        minLength: 15
        description: "Cardinal signs and physical presentation in >60% of patients"
      secondary_presentation:
        type: string
        minLength: 15
        description: "Atypical, pediatric, female, or geriatric variants"
      risk_factors:
        type: string
        minLength: 10
        description: "Comorbidities, lifestyle, genetics, acute triggers"
      red_flags:
        type: string
        minLength: 10
        description: "Emergency escalation criteria"
      probing_questions:
        type: string
        minLength: 25
        description: "2-4 condition-tailored probing questions"
      differentials:
        type: string
        minLength: 10
        description: "Overlapping differential diagnoses to rule out"
